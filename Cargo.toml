[package]
name = "ghostterm"
version = "0.2.0"
edition = "2021"
license = "MIT"
build = "build.rs"

[dependencies]
iroh = { version = "0.33", features = ["discovery-local-network"] }
iroh-gossip = "0.33"
tokio = { version = "1", features = ["full"] }
futures-lite = "2.3"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
clap = { version = "4.4", features = ["derive"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3.3"
base64 = "0.22"
hex = "0.4.3"
rand = "0.8"
anyhow = "1.0"
bytes = "1"

# --- new in v0.2 ---
zeroize = { version = "1.8", features = ["derive"] }
region = "3"            # cross-platform mlock (Unix) / VirtualLock (Windows) + page-aligned alloc

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"            # mlockall, madvise(MADV_DONTDUMP), prctl, setrlimit

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"